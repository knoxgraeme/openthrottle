schema: openthrottle.eval-definition/v1
id: core/admission-review-result
evaluator: core/admission-review-outcome@1
result:
  schema: openthrottle.semantic-result-schema/v1
  id: core/admission-review-result
  outcomes:
    - approved
    - rejected
    - needs_human
    - semantic_repair_required
    - retryable_infrastructure_failure
    - failure
  payload:
    summary:
      type: string
      max_length: 4000
      normalize: string-array-to-newlines/v1
    findings:
      type: string_list
      max_length: 2000
      max_items: 64
    questions:
      type: string_list
      max_length: 1000
      max_items: 16
