schema: openthrottle.eval-definition/v1
id: core/persona-selection
evaluator: core/action-outcome@1
result:
  schema: openthrottle.semantic-result-schema/v1
  id: core/persona-selection
  outcomes:
    - success
    - no_change
    - semantic_repair_required
    - needs_human
    - retryable_infrastructure_failure
    - failure
  payload:
    summary:
      type: string
      required: true
      max_length: 1000
      normalize: string-array-to-newlines/v1
    personas:
      type: string_list
      required: true
      max_length: 200
      max_items: 5
