schema: openthrottle.eval-definition/v1
id: core/admission-result
evaluator: core/admission-outcome@1
result:
  schema: openthrottle.semantic-result-schema/v1
  id: core/admission-result
  outcomes:
    - simple
    - structured
    - needs_human
    - semantic_repair_required
    - retryable_infrastructure_failure
    - failure
  payload:
    summary:
      type: string
      required: true
      max_length: 2000
      normalize: string-array-to-newlines/v1
    execution_plan:
      type: execution_plan_v2
      required: true
    questions:
      type: string_list
      required: true
      max_length: 1000
      max_items: 16
