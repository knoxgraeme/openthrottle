schema: openthrottle.eval-definition/v1
id: core/unit-result
evaluator: core/unit-outcome@1
result:
  schema: openthrottle.semantic-result-schema/v1
  id: core/unit-result
  outcomes:
    - success
    - failure
    - needs_human
    - exited
  payload:
    summary:
      type: string
      max_length: 4000
      normalize: string-array-to-newlines/v1
    assumptions:
      type: string_list
      max_length: 1000
      max_items: 32
    decisions:
      type: string_list
      max_length: 1000
      max_items: 32
    issues:
      type: string_list
      max_length: 1000
      max_items: 32
    verification:
      type: string_list
      max_length: 1000
      max_items: 32
    downstream_context:
      type: string_list
      max_length: 1000
      max_items: 32
    requested_human_input:
      type: string_list
      max_length: 1000
      max_items: 16
