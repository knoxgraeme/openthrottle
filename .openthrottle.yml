# .openthrottle.yml — project config for OpenThrottle
# Commit this file so delegated runs use the same repository-level gates.
agent: codex
test: npm test --prefix supervisor && npm test --prefix cli && npm test --prefix sandbox
lint: npm run typecheck --prefix supervisor && npm run typecheck --prefix cli
build: npm run build --prefix supervisor && npm run build --prefix cli
post_bootstrap:
  - npm ci --prefix supervisor
  - npm ci --prefix cli
  - npm ci --prefix sandbox
limits:
  max_turns: 200
  task_timeout: 7200
  # Claude engine only. max_budget_usd is a hard per-run spend ceiling
  # (Claude's --max-budget-usd); fallback_model keeps an unattended run alive
  # when the primary model is overloaded (Claude's --fallback-model). Both are
  # unset by default; Codex/OpenCode ignore them.
  # max_budget_usd: 5.00
  # fallback_model: sonnet
mcp_servers: {}
