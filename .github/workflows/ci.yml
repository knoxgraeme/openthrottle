name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            supervisor/package-lock.json
            cli/package-lock.json
            sandbox/package-lock.json
      - name: Install shell test dependencies
        run: sudo apt-get update && sudo apt-get install -y bats jq
      - name: Install Node dependencies
        run: |
          npm ci --prefix contracts
          npm ci --prefix supervisor
          npm ci --prefix cli
          npm ci --prefix sandbox
      - name: Typecheck
        run: |
          npm run typecheck --prefix contracts
          npm run build --prefix contracts
          npm run typecheck --prefix supervisor
          npm run typecheck --prefix cli
      - name: Build production artifacts
        run: |
          npm run build --prefix supervisor
          npm run build --prefix cli
      - name: Verify clean execution-kernel architecture
        run: npm test --prefix supervisor -- src/__tests__/architecture.test.ts
      - name: Test
        run: |
          npm test --prefix contracts
          npm test --prefix supervisor
          npm test --prefix cli
          npm test --prefix sandbox
          bats sandbox/tests/runtime.bats
          bats sandbox/tests/inbox-drain.bats

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            supervisor/package-lock.json
      - name: Install Node dependencies
        # The walking skeleton harness runs on the host against the BUILT
        # supervisor/contracts dist output, composed with the built image
        # over docker exec -- it needs those dists, not just the images.
        run: |
          npm ci --prefix contracts
          npm ci --prefix supervisor
      - name: Build production artifacts
        run: |
          npm run build --prefix contracts
          npm run build --prefix supervisor
      - name: Build supervisor image
        # Repo-root context so the supervisor's file:../contracts dependency
        # resolves; guards the Fly deploy build (deploy.yml) which CI would
        # otherwise never exercise.
        run: docker build -f supervisor/Dockerfile -t openthrottle-supervisor:test .
      - name: Exercise packaged fresh-epoch initializer
        run: |
          set -euo pipefail
          epoch_volume="openthrottle-ci-epoch-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$epoch_volume" >/dev/null
          cleanup() {
            docker volume rm --force "$epoch_volume" >/dev/null
          }
          trap cleanup EXIT

          docker run --rm \
            --mount "type=volume,src=$epoch_volume,dst=/data" \
            --entrypoint /bin/sh \
            openthrottle-supervisor:test \
            -ec 'test -z "$(ls -A /data)"'
          receipt="$(
            docker run --rm \
              --mount "type=volume,src=$epoch_volume,dst=/data" \
              openthrottle-supervisor:test \
              node /app/scripts/initialize-epoch.mjs
          )"
          retry_receipt="$(
            docker run --rm \
              --mount "type=volume,src=$epoch_volume,dst=/data" \
              openthrottle-supervisor:test \
              node /app/scripts/initialize-epoch.mjs
          )"
          if [ "$retry_receipt" != "$receipt" ]; then
            echo "initializer retry did not return the identical receipt" >&2
            exit 1
          fi
          RECEIPT="$receipt" node --input-type=module <<'NODE'
          const receipt = JSON.parse(process.env.RECEIPT ?? "");
          const sha256 = (value) => typeof value === "string" && /^[a-f0-9]{64}$/.test(value);
          if (
            receipt.schema !== "openthrottle.fresh-epoch-initialization/v1" ||
            receipt.database_path !== "/data/openthrottle-kernel-v1.sqlite" ||
            receipt.blob_store_path !== "/data/openthrottle-kernel-v1-blobs" ||
            receipt.blob_store_id !== "openthrottle-execution-kernel-v1" ||
            receipt.release_id !== "openthrottle-execution-kernel/v1" ||
            !sha256(receipt.blob_marker_checksum) ||
            !sha256(receipt.runtime_capability_digest) ||
            !sha256(receipt.bootstrap_checksum) ||
            !sha256(receipt.schema_checksum) ||
            receipt.schema_version !== 1 ||
            receipt.maintenance_ingress_closed !== true ||
            receipt.integrity !== "ok"
          ) throw new Error("packaged initializer returned an invalid receipt");
          NODE
          docker run --rm \
            --mount "type=volume,src=$epoch_volume,dst=/data" \
            --entrypoint /bin/sh \
            openthrottle-supervisor:test \
            -ec 'test -f /data/openthrottle-kernel-v1.sqlite && test -f /data/openthrottle-kernel-v1-blobs/.openthrottle-blob-store.json'
      - name: Exercise packaged release acceptance
        run: |
          set -euo pipefail
          acceptance_volume="openthrottle-ci-accept-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          supervisor_container="openthrottle-ci-accepted-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$acceptance_volume" >/dev/null
          cleanup() {
            docker rm --force "$supervisor_container" >/dev/null 2>&1 || true
            docker volume rm --force "$acceptance_volume" >/dev/null
          }
          trap cleanup EXIT

          old_runtime="$(printf '0%.0s' {1..64})"
          bootstrap_checksum="$(
            docker run --rm -i \
              --mount "type=volume,src=$acceptance_volume,dst=/data" \
              openthrottle-supervisor:test node --input-type=module <<'NODE'
          import { VolumeBlobStore } from "/app/dist/persistence/blob-store.js";
          import {
            createFreshEpochBootstrap,
            initializeFreshEpochDatabase,
          } from "/app/dist/persistence/epoch-database.js";
          const blobs = VolumeBlobStore.initialize(
            "/data/openthrottle-kernel-v1-blobs",
            "openthrottle-execution-kernel-v1",
          );
          const bootstrap = createFreshEpochBootstrap({
            schema: "openthrottle.fresh-epoch-bootstrap/v1",
            settings: [],
            repository_registrations: [],
          });
          initializeFreshEpochDatabase({
            database_path: "/data/openthrottle-kernel-v1.sqlite",
            blob_store: blobs,
            release_id: "openthrottle-execution-kernel/v1",
            runtime_capability_digest: "0".repeat(64),
            bootstrap,
          }).close();
          process.stdout.write(`${bootstrap.checksum}\n`);
          NODE
          )"
          candidate="$(
            docker run --rm \
              --env OT_EPOCH_RELEASE_ID=openthrottle-execution-kernel/v1 \
              openthrottle-supervisor:test \
              node /app/scripts/accept-release.mjs --candidate-identity
          )"
          candidate_runtime="$(jq -er .runtime_capability_digest <<<"$candidate")"
          transition_id="ci-accept-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          accept_release() {
            docker run --rm \
              --mount "type=volume,src=$acceptance_volume,dst=/data" \
              --env OT_BLOB_STORE_ID=openthrottle-execution-kernel-v1 \
              --env OT_EPOCH_RELEASE_ID=openthrottle-execution-kernel/v1 \
              --env "OT_EPOCH_BOOTSTRAP_CHECKSUM=$bootstrap_checksum" \
              --env OT_ACCEPT_RELEASE_EXPECTED_RELEASE_ID=openthrottle-execution-kernel/v1 \
              --env "OT_ACCEPT_RELEASE_EXPECTED_RUNTIME_CAPABILITY_DIGEST=$old_runtime" \
              --env OT_ACCEPT_RELEASE_MAINTENANCE_VERSION=0 \
              --env "OT_ACCEPT_RELEASE_TRANSITION_ID=$transition_id" \
              openthrottle-supervisor:test node /app/scripts/accept-release.mjs
          }

          docker run --rm -i \
            --mount "type=volume,src=$acceptance_volume,dst=/data" \
            openthrottle-supervisor:test node --input-type=module <<'NODE'
          import Database from "/app/node_modules/better-sqlite3/lib/index.js";
          const db = new Database("/data/openthrottle-kernel-v1.sqlite");
          db.prepare(`INSERT INTO leases
            (lease_key, purpose, owner_id, lease_id, expires_at, version, metadata_json, updated_at)
            VALUES ('ci', 'proof', 'ci', 'ci-lease', '2026-08-25T00:00:00.000Z', 0, '{}', '2026-08-25T00:00:00.000Z')
          `).run();
          db.close();
          NODE
          if accept_release >"$RUNNER_TEMP/nonquiescent-receipt" 2>"$RUNNER_TEMP/nonquiescent-error"; then
            echo "accept-release accepted a non-quiescent epoch" >&2
            exit 1
          fi
          grep -q "epoch is not quiesced" "$RUNNER_TEMP/nonquiescent-error"
          docker run --rm -i \
            --mount "type=volume,src=$acceptance_volume,dst=/data" \
            openthrottle-supervisor:test node --input-type=module <<'NODE'
          import Database from "/app/node_modules/better-sqlite3/lib/index.js";
          const db = new Database("/data/openthrottle-kernel-v1.sqlite");
          db.prepare("DELETE FROM leases WHERE lease_key = 'ci'").run();
          db.exec("CREATE TABLE unexpected_schema_change (id INTEGER PRIMARY KEY) STRICT");
          db.close();
          NODE
          if accept_release >"$RUNNER_TEMP/schema-receipt" 2>"$RUNNER_TEMP/schema-error"; then
            echo "accept-release accepted a changed schema" >&2
            exit 1
          fi
          grep -Eq "schema|table set|fresh epoch" "$RUNNER_TEMP/schema-error"
          docker run --rm -i \
            --mount "type=volume,src=$acceptance_volume,dst=/data" \
            openthrottle-supervisor:test node --input-type=module <<'NODE'
          import Database from "/app/node_modules/better-sqlite3/lib/index.js";
          const db = new Database("/data/openthrottle-kernel-v1.sqlite");
          db.exec("DROP TABLE unexpected_schema_change");
          db.close();
          NODE

          receipt="$(accept_release)"
          replay="$(accept_release)"
          if [ "$receipt" != "$replay" ]; then
            echo "accept-release exact replay did not return the identical receipt" >&2
            exit 1
          fi
          jq -e --arg runtime "$candidate_runtime" '
            .schema == "openthrottle.epoch-release-acceptance/v1" and
            .to_identity.runtime_capability_digest == $runtime
          ' <<<"$receipt" >/dev/null

          docker run --detach --name "$supervisor_container" \
            --mount "type=volume,src=$acceptance_volume,dst=/data" \
            --env SUPERVISOR_URL=http://127.0.0.1:8080 \
            --env OT_STATUS_TOKEN=status-token \
            --env OT_DEPLOY_TOKEN=deploy-token \
            --env GITHUB_WEBHOOK_SECRET=webhook-secret \
            --env GITHUB_TOKEN=github-token \
            --env GITHUB_READ_TOKEN=github-read-token \
            --env DAYTONA_API_KEY=daytona-token \
            --env "OT_EPOCH_BOOTSTRAP_CHECKSUM=$bootstrap_checksum" \
            openthrottle-supervisor:test >/dev/null
          for attempt in $(seq 1 20); do
            if docker logs "$supervisor_container" 2>&1 | grep -q "fresh kernel listening"; then
              [ "$(docker inspect --format '{{.State.Running}}' "$supervisor_container")" = "true" ]
              exit 0
            fi
            if (( attempt < 20 )); then sleep 1; fi
          done
          echo "accepted packaged supervisor did not complete open-only startup" >&2
          docker logs "$supervisor_container" >&2 || true
          exit 1
      - name: Build sandbox image
        run: docker build -f sandbox/Dockerfile -t openthrottle:test .
      - name: Exercise sandbox lifecycle with stub agent
        run: sandbox/tests/smoke.sh openthrottle:test
      - name: Prove supervisor kernel settlement through the sandbox transport
        run: node supervisor/scripts/kernel-sandbox-e2e.mjs openthrottle:test
      - name: Prove structured checkpoint integration on the shared kernel
        run: node sandbox/tests/structured-walking-skeleton.mjs openthrottle:test
