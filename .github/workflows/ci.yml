name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            supervisor/package-lock.json
            cli/package-lock.json
            sandbox/package-lock.json
      - name: Install shell test dependencies
        run: sudo apt-get update && sudo apt-get install -y bats jq
      - name: Install Node dependencies
        run: |
          npm ci --prefix contracts
          npm ci --prefix supervisor
          npm ci --prefix cli
          npm ci --prefix sandbox
      - name: Typecheck
        run: |
          npm run typecheck --prefix contracts
          npm run build --prefix contracts
          npm run typecheck --prefix supervisor
          npm run typecheck --prefix cli
      - name: Build production artifacts
        run: |
          npm run build --prefix supervisor
          npm run build --prefix cli
      - name: Verify clean execution-kernel architecture
        run: npm test --prefix supervisor -- src/__tests__/architecture.test.ts
      - name: Test
        run: |
          npm test --prefix contracts
          npm test --prefix supervisor
          npm test --prefix cli
          npm test --prefix sandbox
          bats sandbox/tests/runtime.bats
          bats sandbox/tests/inbox-drain.bats

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            supervisor/package-lock.json
      - name: Install Node dependencies
        # The walking skeleton harness runs on the host against the BUILT
        # supervisor/contracts dist output, composed with the built image
        # over docker exec -- it needs those dists, not just the images.
        run: |
          npm ci --prefix contracts
          npm ci --prefix supervisor
      - name: Build production artifacts
        run: |
          npm run build --prefix contracts
          npm run build --prefix supervisor
      - name: Build supervisor image
        # Repo-root context so the supervisor's file:../contracts dependency
        # resolves; guards the Fly deploy build (deploy.yml) which CI would
        # otherwise never exercise.
        run: docker build -f supervisor/Dockerfile -t openthrottle-supervisor:test .
      - name: Exercise packaged fresh-epoch initializer
        run: |
          set -euo pipefail
          epoch_volume="openthrottle-ci-epoch-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "$epoch_volume" >/dev/null
          cleanup() {
            docker volume rm --force "$epoch_volume" >/dev/null
          }
          trap cleanup EXIT

          docker run --rm \
            --mount "type=volume,src=$epoch_volume,dst=/data" \
            --entrypoint /bin/sh \
            openthrottle-supervisor:test \
            -ec 'test -z "$(ls -A /data)"'
          receipt="$(
            docker run --rm \
              --mount "type=volume,src=$epoch_volume,dst=/data" \
              openthrottle-supervisor:test \
              node /app/scripts/initialize-epoch.mjs
          )"
          retry_receipt="$(
            docker run --rm \
              --mount "type=volume,src=$epoch_volume,dst=/data" \
              openthrottle-supervisor:test \
              node /app/scripts/initialize-epoch.mjs
          )"
          if [ "$retry_receipt" != "$receipt" ]; then
            echo "initializer retry did not return the identical receipt" >&2
            exit 1
          fi
          RECEIPT="$receipt" node --input-type=module <<'NODE'
          const receipt = JSON.parse(process.env.RECEIPT ?? "");
          const sha256 = (value) => typeof value === "string" && /^[a-f0-9]{64}$/.test(value);
          if (
            receipt.schema !== "openthrottle.fresh-epoch-initialization/v1" ||
            receipt.database_path !== "/data/openthrottle-kernel-v1.sqlite" ||
            receipt.blob_store_path !== "/data/openthrottle-kernel-v1-blobs" ||
            receipt.blob_store_id !== "openthrottle-execution-kernel-v1" ||
            receipt.release_id !== "openthrottle-execution-kernel/v1" ||
            !sha256(receipt.blob_marker_checksum) ||
            !sha256(receipt.runtime_capability_digest) ||
            !sha256(receipt.bootstrap_checksum) ||
            !sha256(receipt.schema_checksum) ||
            receipt.schema_version !== 1 ||
            receipt.maintenance_ingress_closed !== true ||
            receipt.integrity !== "ok"
          ) throw new Error("packaged initializer returned an invalid receipt");
          NODE
          docker run --rm \
            --mount "type=volume,src=$epoch_volume,dst=/data" \
            --entrypoint /bin/sh \
            openthrottle-supervisor:test \
            -ec 'test -f /data/openthrottle-kernel-v1.sqlite && test -f /data/openthrottle-kernel-v1-blobs/.openthrottle-blob-store.json'
      - name: Build sandbox image
        run: docker build -f sandbox/Dockerfile -t openthrottle:test .
      - name: Exercise sandbox lifecycle with stub agent
        run: sandbox/tests/smoke.sh openthrottle:test
      - name: Prove supervisor kernel settlement through the sandbox transport
        run: node supervisor/scripts/kernel-sandbox-e2e.mjs openthrottle:test
      - name: Prove structured checkpoint integration on the shared kernel
        run: node sandbox/tests/structured-walking-skeleton.mjs openthrottle:test
