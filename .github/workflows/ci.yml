name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            supervisor/package-lock.json
            cli/package-lock.json
            sandbox/package-lock.json
      - name: Install shell test dependencies
        run: sudo apt-get update && sudo apt-get install -y bats jq
      - name: Install Node dependencies
        run: |
          npm ci --prefix contracts
          npm ci --prefix supervisor
          npm ci --prefix cli
          npm ci --prefix sandbox
      - name: Typecheck
        run: |
          npm run typecheck --prefix contracts
          npm run build --prefix contracts
          npm run typecheck --prefix supervisor
          npm run typecheck --prefix cli
      - name: Build production artifacts
        run: |
          npm run build --prefix supervisor
          npm run build --prefix cli
      - name: Verify pipeline docs are regenerated
        run: |
          npm run docs:pipelines --prefix supervisor
          git add --intent-to-add -- docs/pipelines
          git diff --exit-code -- docs/pipelines
      - name: Verify supervisor architecture, catalog, runtime, and adapter parity
        run: |
          npm test --prefix supervisor -- src/__tests__/architecture.test.ts src/pipeline/manifest.test.ts src/pipeline/stage-request.test.ts src/runtime/contracts.test.ts
          npm test --prefix sandbox -- runner/capabilities.test.mjs tests/ce-adapters.test.mjs
      - name: Test
        run: |
          npm test --prefix contracts
          npm test --prefix supervisor
          npm test --prefix cli
          npm test --prefix sandbox
          bats sandbox/tests/runtime.bats
          bats sandbox/tests/inbox-drain.bats

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sandbox image
        run: docker build -f sandbox/Dockerfile -t openthrottle:test .
      - name: Exercise sandbox lifecycle with stub agent
        run: sandbox/tests/smoke.sh openthrottle:test
