name: Deploy

# Rebuilds the Daytona sandbox snapshot and/or deploys the Fly supervisor when
# the paths that feed them change on main. Manual dispatch can force either.
#
# The deploy job first ensures the Fly app and its /data volume exist, so a
# fresh account bootstraps itself instead of failing with "Could not find App".
# The operator still sets the runtime secrets once (see supervisor/README.md);
# until then the deploy releases but the health check fails.
#
# Required repository secrets:
#   DAYTONA_API_KEY — builds/registers snapshots (same key the supervisor uses)
#   FLY_API_TOKEN   — deploy token for the supervisor app (org-scoped, so it can
#                     create the app on first run)
# Optional repository variables:
#   FLY_APP    — Fly app name; defaults to openthrottle-supervisor
#   FLY_ORG    — Fly org for first-time app creation; defaults to personal
#   FLY_REGION — region for the app's data volume; defaults to sjc

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_snapshot:
        description: "Force a Daytona snapshot rebuild"
        type: boolean
        default: false
      deploy_supervisor:
        description: "Force a Fly supervisor deploy"
        type: boolean
        default: false
      prepare_v12_cutover:
        description: "Use the deployed v12 fence before a later cutover"
        type: boolean
        default: false
      resume_after_v12_cutover:
        description: "Resume admission after the v12 cutover proves clear"
        type: boolean
        default: false
      expected_snapshot:
        description: "Exact snapshot expected after cutover (defaults to one built in this run)"
        type: string
        required: false

permissions:
  contents: read

# Serialize deploys; never cancel one mid-flight.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      sandbox: ${{ steps.filter.outputs.sandbox }}
      skills: ${{ steps.filter.outputs.skills }}
      runtime_descriptor: ${{ steps.filter.outputs.runtime_descriptor }}
      supervisor: ${{ steps.filter.outputs.supervisor }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            sandbox:
              - 'sandbox/**'
              - '!sandbox/tests/**'
              - '!sandbox/**/*.test.mjs'
            skills:
              - 'skills/**'
            runtime_descriptor:
              - 'supervisor/pipelines/runtime-capabilities-v1.json'
            supervisor:
              - 'supervisor/**'

  snapshot:
    needs: changes
    if: >-
      needs.changes.outputs.sandbox == 'true' ||
      needs.changes.outputs.skills == 'true' ||
      needs.changes.outputs.runtime_descriptor == 'true' ||
      inputs.build_snapshot
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.build.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supervisor/package-lock.json
      - name: Install supervisor dependencies (for @daytona/sdk)
        run: npm ci --prefix supervisor
      - name: Build and register the Daytona snapshot
        id: build
        env:
          DAYTONA_API_KEY: ${{ secrets.DAYTONA_API_KEY }}
          # Optional sandbox sizing overrides. Empty repo variables fall through
          # to the script defaults (4 vCPU / 8 GiB / 5 GiB), which clear the
          # small default tier that OOM-kills monorepo build gates. Disk is kept
          # small because Daytona's 30 GiB total org quota is shared across every
          # retained sandbox; raise it via the repo variable only on a
          # larger-quota plan.
          DAYTONA_SANDBOX_CPU: ${{ vars.DAYTONA_SANDBOX_CPU }}
          DAYTONA_SANDBOX_MEMORY: ${{ vars.DAYTONA_SANDBOX_MEMORY }}
          DAYTONA_SANDBOX_DISK: ${{ vars.DAYTONA_SANDBOX_DISK }}
        run: |
          name="openthrottle-v2-ce-$(git rev-parse --short=7 HEAD)"
          node supervisor/scripts/build-snapshot.mjs "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

  deploy:
    needs: [changes, snapshot]
    # Run when supervisor code changed, when a new snapshot must be released to
    # the app (the staged secret applies on deploy), or when forced. Never run
    # if the snapshot build failed — the secret would point at a broken build.
    if: >-
      !cancelled() && needs.snapshot.result != 'failure' &&
      (needs.changes.outputs.supervisor == 'true' ||
       needs.snapshot.result == 'success' ||
       inputs.deploy_supervisor)
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: ${{ vars.FLY_APP || 'openthrottle-supervisor' }}
      FLY_ORG: ${{ vars.FLY_ORG || 'personal' }}
      FLY_REGION: ${{ vars.FLY_REGION || 'sjc' }}
      EXPECTED_SNAPSHOT: ${{ needs.snapshot.outputs.name || inputs.expected_snapshot }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Ensure the Fly app and data volume exist
        run: |
          set -euo pipefail
          # Create the app if it is missing. Tolerate only the already-exists
          # error so real failures (bad token, unknown org) still surface.
          if ! flyctl apps create "$FLY_APP" --org "$FLY_ORG" 2>create.log; then
            if grep -qiE "taken|already exists|already been" create.log; then
              echo "Fly app $FLY_APP already exists."
            else
              cat create.log >&2
              exit 1
            fi
          fi
          # fly.toml mounts /data from openthrottle_data; create it once so the
          # first deploy on a fresh app does not fail on a missing volume.
          if flyctl volumes list --app "$FLY_APP" 2>/dev/null | grep -q "openthrottle_data"; then
            echo "openthrottle_data volume already exists."
          else
            echo "Creating openthrottle_data volume in $FLY_REGION."
            flyctl volumes create openthrottle_data \
              --app "$FLY_APP" --region "$FLY_REGION" --size 1 --yes
          fi
      - name: Execute the v12 snapshot cutover transaction
        # This supervisor-only fence release does not build a snapshot, so its
        # first push deploys without calling endpoints its parent lacks. Once
        # installed, every push that builds a new snapshot gates automatically.
        if: inputs.prepare_v12_cutover || (github.event_name == 'push' && needs.snapshot.result == 'success')
        run: |
          set -euo pipefail
          if [[ -z "${EXPECTED_SNAPSHOT}" ]]; then
            echo "expected_snapshot is required when this run does not build a snapshot" >&2
            exit 1
          fi
          deployed=0
          cutover_id=""

          cutover_command() {
            local action="$1"
            local payload="${2:-}"
            if [[ -n "$payload" ]]; then
              flyctl ssh console --app "$FLY_APP" --command \
                "node /app/scripts/cutover-control.mjs $action $(printf '%q' "$payload")"
            else
              flyctl ssh console --app "$FLY_APP" --command \
                "node /app/scripts/cutover-control.mjs $action"
            fi
          }

          advance_cutover() {
            local phase="$1"
            local status="${2:-active}"
            local evidence="${3:-}"
            local recovery="${4:-}"
            local payload
            payload="$(jq -nc \
              --arg id "$cutover_id" \
              --arg phase "$phase" \
              --arg status "$status" \
              --arg evidence "$evidence" \
              --arg recovery "$recovery" \
              '{id:$id, phase:$phase, status:$status, evidence:$evidence} +
               (if $recovery == "" then {} else {recoveryCommand:$recovery} end)')"
            cutover_command advance "$payload" | jq .
          }

          abort_cutover() {
            local exit_code="$1"
            trap - ERR
            if [[ -z "$cutover_id" ]]; then
              exit "$exit_code"
            fi
            if (( deployed == 1 )); then
              advance_cutover recovery_required recovery_required \
                "deploy started before workflow abort; operator must inspect active release before resuming" \
                "flyctl ssh console --app $FLY_APP --command 'node /app/scripts/cutover-control.mjs evidence'"
              exit "$exit_code"
            fi

            flyctl secrets set --stage --app "$FLY_APP" DAYTONA_SNAPSHOT="$old_snapshot" || true
            local restored
            restored="$(cutover_command evidence || true)"
            if printf '%s\n' "$restored" | jq -e \
              --arg release "$old_release" \
              --arg snapshot "$old_snapshot" \
              '.runtime.release == $release and .snapshot == $snapshot' >/dev/null; then
              cutover_command resume | jq .
              advance_cutover restored active "$restored"
            else
              advance_cutover recovery_required recovery_required "$restored" \
                "flyctl secrets set --stage --app $FLY_APP DAYTONA_SNAPSHOT=$old_snapshot && flyctl ssh console --app $FLY_APP --command 'node /app/scripts/cutover-control.mjs resume'"
            fi
            exit "$exit_code"
          }
          trap 'abort_cutover $?' ERR

          initial_evidence="$(cutover_command evidence)"
          printf '%s\n' "$initial_evidence" | jq .
          old_release="$(printf '%s\n' "$initial_evidence" | jq -r '.runtime.release')"
          old_snapshot="$(printf '%s\n' "$initial_evidence" | jq -r '.snapshot')"
          begin_payload="$(jq -nc \
            --arg oldRuntimeRelease "$old_release" \
            --arg oldSnapshot "$old_snapshot" \
            --arg candidateSnapshot "$EXPECTED_SNAPSHOT" \
            --arg evidence "$initial_evidence" \
            '{oldRuntimeRelease:$oldRuntimeRelease, oldSnapshot:$oldSnapshot,
              candidateSnapshot:$candidateSnapshot, evidence:$evidence}')"
          begin_evidence="$(cutover_command begin "$begin_payload")"
          printf '%s\n' "$begin_evidence" | jq .
          cutover_id="$(printf '%s\n' "$begin_evidence" | jq -r '.cutover.id')"

          pause_evidence="$(cutover_command pause)"
          printf '%s\n' "$pause_evidence" | jq .
          pause_epoch="$(printf '%s\n' "$pause_evidence" | jq -r '.admission.epoch')"
          advance_payload="$(jq -nc \
            --arg id "$cutover_id" \
            --arg phase paused \
            --arg status active \
            --arg evidence "$pause_evidence" \
            --argjson pauseEpoch "$pause_epoch" \
            '{id:$id, phase:$phase, status:$status, evidence:$evidence, pauseEpoch:$pauseEpoch}')"
          cutover_command advance "$advance_payload" | jq .

          deadline=$((SECONDS + 600))
          while true; do
            evidence="$(cutover_command evidence)"
            printf '%s\n' "$evidence" | jq .
            if printf '%s\n' "$evidence" | jq -e \
              --argjson epoch "$pause_epoch" \
              '.admission.paused == 1 and .admission.epoch == $epoch and .drain.clear == true' >/dev/null; then
              break
            fi
            if (( SECONDS >= deadline )); then
              echo "v12 cutover drain did not clear within 600 seconds" >&2
              abort_cutover 1
            fi
            sleep 10
          done
          advance_cutover drain_clear active "$evidence"

          flyctl secrets set --stage --app "$FLY_APP" DAYTONA_SNAPSHOT="$EXPECTED_SNAPSHOT"
          advance_cutover staged active "candidate DAYTONA_SNAPSHOT staged only after drain_clear for epoch $pause_epoch"

          flyctl deploy --remote-only --app "$FLY_APP" --config supervisor/fly.toml --dockerfile supervisor/Dockerfile
          deployed=1
          advance_cutover deployed active "flyctl deploy completed for candidate snapshot $EXPECTED_SNAPSHOT"

          evidence="$(cutover_command evidence)"
          printf '%s\n' "$evidence" | jq .
          expected_release="$(jq -r '.runtime.release' supervisor/pipelines/v12-deploy-proof.json)"
          expected_digest="$(jq -r '.runtime.digest' supervisor/pipelines/v12-deploy-proof.json)"
          printf '%s\n' "$evidence" | jq -e \
            --arg release "$expected_release" \
            --arg digest "$expected_digest" \
            --arg snapshot "$EXPECTED_SNAPSHOT" \
            --argjson epoch "$pause_epoch" \
            '.admission.paused == 1 and
             .admission.epoch == $epoch and
             .drain.clear == true and
             .runtime.release == $release and
             .runtime.capabilityDigest == $digest and
             .snapshot == $snapshot' >/dev/null
          advance_cutover verified active "$evidence"

          if [[ "${{ github.event_name }}" == "push" || "${{ inputs.resume_after_v12_cutover }}" == "true" ]]; then
            resume_evidence="$(cutover_command resume)"
            printf '%s\n' "$resume_evidence" | jq .
            advance_cutover resumed completed "$resume_evidence"
          fi
          trap - ERR
      - name: Deploy the supervisor
        if: ${{ !(inputs.prepare_v12_cutover || (github.event_name == 'push' && needs.snapshot.result == 'success')) }}
        # Build from the repository root so the supervisor's file:../contracts
        # dependency is inside the Docker build context.
        run: flyctl deploy --remote-only --app "$FLY_APP" --config supervisor/fly.toml --dockerfile supervisor/Dockerfile
