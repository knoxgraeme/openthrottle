name: Release

# Produces the digest-pinned release artifacts `openthrottle setup` verifies
# against (cli/src/onboarding/release-manifest.ts):
#
#   - ghcr.io/knoxgraeme/openthrottle-supervisor@sha256:...  (supervisor/Dockerfile)
#   - ghcr.io/knoxgraeme/openthrottle-sandbox@sha256:...     (sandbox/Dockerfile)
#   - cli/release-manifest.json, generated by generate-release-manifest.mjs and
#     baked into the CLI's dist/ (and therefore into the npm package)
#
# Both images build from the REPO ROOT context: the supervisor for its
# file:../contracts dependency, and the sandbox for release-sealed definitions,
# generated result validators, and its Codex safety context.
#
# A push to main publishes a package version that is not already on npm. Tag
# pushes still produce release artifacts and publish an unpublished version;
# manual dispatch only produces artifacts. npm authentication uses a trusted
# publisher configured for this workflow, never a long-lived repository token.
#
# GHCR packages are PRIVATE on first push. Make both image packages public
# once (per package) or anonymous pulls of the pinned digests will fail; see
# docs/runbooks/onboarding-release-acceptance.md.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_id:
        description: "Release id for image tags and the manifest (defaults to the cli package version)"
        type: string
        required: false

# Serialize releases per ref; never cancel one mid-push.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_id: ${{ steps.meta.outputs.release_id }}
      run_release: ${{ steps.meta.outputs.run_release }}
      publish_npm: ${{ steps.meta.outputs.publish_npm }}
      dist_tag: ${{ steps.meta.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
          registry-url: "https://registry.npmjs.org"
      - name: Plan the release
        id: meta
        env:
          RELEASE_ID_INPUT: ${{ inputs.release_id }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          release_id="${RELEASE_ID_INPUT:-$(node -p "require('./cli/package.json').version")}"
          dist_tag="latest"
          if [[ "$release_id" == *-* ]]; then
            dist_tag="next"
          fi

          run_release="true"
          publish_npm="false"
          if [[ "$EVENT_NAME" == "push" ]]; then
            if npm view "openthrottle@${release_id}" version --json >/dev/null 2>&1; then
              echo "openthrottle@${release_id} already exists on npm."
              if [[ "$REF_TYPE" == "branch" ]]; then
                run_release="false"
              fi
            else
              publish_npm="true"
            fi
          fi

          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "run_release=$run_release" >> "$GITHUB_OUTPUT"
          echo "publish_npm=$publish_npm" >> "$GITHUB_OUTPUT"
          echo "dist_tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "Release id: $release_id; npm tag: $dist_tag; run: $run_release; publish: $publish_npm"

  release:
    needs: plan
    if: needs.plan.outputs.run_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            cli/package-lock.json
          registry-url: "https://registry.npmjs.org"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the supervisor image
        id: supervisor
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: supervisor/Dockerfile
          push: true
          tags: ghcr.io/knoxgraeme/openthrottle-supervisor:${{ needs.plan.outputs.release_id }}
          # Keep the pushed artifact a plain image manifest so the digest the
          # release manifest pins is the digest every consumer pulls.
          provenance: false
      - name: Build and push the sandbox image
        id: sandbox
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: sandbox/Dockerfile
          push: true
          tags: ghcr.io/knoxgraeme/openthrottle-sandbox:${{ needs.plan.outputs.release_id }}
          provenance: false
      - name: Generate the release manifest
        # generate-release-manifest.mjs is dependency-free by design and runs
        # before any npm ci; it validates the digest-pinned refs itself.
        env:
          RELEASE_ID: ${{ needs.plan.outputs.release_id }}
          SUPERVISOR_DIGEST: ${{ steps.supervisor.outputs.digest }}
          SANDBOX_DIGEST: ${{ steps.sandbox.outputs.digest }}
        run: |
          node cli/scripts/generate-release-manifest.mjs \
            --supervisor-image "ghcr.io/knoxgraeme/openthrottle-supervisor@${SUPERVISOR_DIGEST}" \
            --sandbox-image "ghcr.io/knoxgraeme/openthrottle-sandbox@${SANDBOX_DIGEST}" \
            --snapshot-name "openthrottle-${RELEASE_ID}" \
            --release-id "${RELEASE_ID}"
      - name: Build the CLI with the baked manifest
        # The cli build (copy-planning-skills.mjs) copies cli/release-manifest.json
        # into dist/, where loadReleaseManifest reads it at runtime.
        run: |
          npm ci --prefix contracts
          npm run build --prefix contracts
          npm ci --prefix cli
          npm run build --prefix cli
      - name: Test the CLI (release gate)
        run: npm test --prefix cli
      - name: Pack the CLI tarball
        # Folder spec, not --prefix: npm pack/publish resolve the package from
        # the cwd and this repository has no root package.json.
        run: npm pack ./cli --pack-destination "$PWD"
      - name: Upload the manifest and tarball as workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: openthrottle-release-${{ needs.plan.outputs.release_id }}
          path: |
            cli/release-manifest.json
            openthrottle-*.tgz
          if-no-files-found: error

  publish:
    needs: [plan, release]
    if: needs.plan.outputs.publish_npm == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.14.0
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: openthrottle-release-${{ needs.plan.outputs.release_id }}
          path: release
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1
      - name: Publish the CLI to npm
        env:
          NPM_DIST_TAG: ${{ needs.plan.outputs.dist_tag }}
        # Publish the exact tarball uploaded as the release artifact so the
        # published bytes match the acceptance evidence. OIDC trusted
        # publishing also attaches npm provenance to those bytes.
        run: npm publish "$PWD"/release/openthrottle-*.tgz --access public --provenance --tag "$NPM_DIST_TAG"
