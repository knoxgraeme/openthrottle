name: Release

# Produces the digest-pinned release artifacts `openthrottle setup` verifies
# against (cli/src/onboarding/release-manifest.ts):
#
#   - ghcr.io/knoxgraeme/openthrottle-supervisor@sha256:...  (supervisor/Dockerfile)
#   - ghcr.io/knoxgraeme/openthrottle-sandbox@sha256:...     (sandbox/Dockerfile)
#   - cli/release-manifest.json, generated by generate-release-manifest.mjs and
#     baked into the CLI's dist/ (and therefore into the npm package)
#
# Both images build from the REPO ROOT context: the supervisor for its
# file:../contracts dependency, the sandbox for the root-level skills/ payload.
#
# Tag pushes (v*) publish the CLI to npm when the NPM_TOKEN secret is set.
# Manual dispatch — or a missing NPM_TOKEN — never fails the workflow; it
# degrades to uploading the manifest and a packed tarball as artifacts.
#
# GHCR packages are PRIVATE on first push. Make both image packages public
# once (per package) or anonymous pulls of the pinned digests will fail; see
# docs/runbooks/onboarding-release-acceptance.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_id:
        description: "Release id for image tags and the manifest (defaults to the cli package version)"
        type: string
        required: false

permissions:
  contents: read
  packages: write

# Serialize releases per ref; never cancel one mid-push.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            cli/package-lock.json
          registry-url: "https://registry.npmjs.org"
      - name: Resolve release id
        id: meta
        env:
          RELEASE_ID_INPUT: ${{ inputs.release_id }}
        run: |
          release_id="${RELEASE_ID_INPUT:-$(node -p "require('./cli/package.json').version")}"
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"
          echo "Release id: $release_id"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the supervisor image
        id: supervisor
        uses: docker/build-push-action@v6
        with:
          context: .
          file: supervisor/Dockerfile
          push: true
          tags: ghcr.io/knoxgraeme/openthrottle-supervisor:${{ steps.meta.outputs.release_id }}
          # Keep the pushed artifact a plain image manifest so the digest the
          # release manifest pins is the digest every consumer pulls.
          provenance: false
      - name: Build and push the sandbox image
        id: sandbox
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sandbox/Dockerfile
          push: true
          tags: ghcr.io/knoxgraeme/openthrottle-sandbox:${{ steps.meta.outputs.release_id }}
          provenance: false
      - name: Generate the release manifest
        # generate-release-manifest.mjs is dependency-free by design and runs
        # before any npm ci; it validates the digest-pinned refs itself.
        env:
          RELEASE_ID: ${{ steps.meta.outputs.release_id }}
          SUPERVISOR_DIGEST: ${{ steps.supervisor.outputs.digest }}
          SANDBOX_DIGEST: ${{ steps.sandbox.outputs.digest }}
        run: |
          node cli/scripts/generate-release-manifest.mjs \
            --supervisor-image "ghcr.io/knoxgraeme/openthrottle-supervisor@${SUPERVISOR_DIGEST}" \
            --sandbox-image "ghcr.io/knoxgraeme/openthrottle-sandbox@${SANDBOX_DIGEST}" \
            --snapshot-name "openthrottle-${RELEASE_ID}" \
            --release-id "${RELEASE_ID}"
      - name: Build the CLI with the baked manifest
        # The cli build (copy-planning-skills.mjs) copies cli/release-manifest.json
        # into dist/, where loadReleaseManifest reads it at runtime.
        run: |
          npm ci --prefix contracts
          npm run build --prefix contracts
          npm ci --prefix cli
          npm run build --prefix cli
      - name: Test the CLI (release gate)
        run: npm test --prefix cli
      - name: Pack the CLI tarball
        # Folder spec, not --prefix: npm pack/publish resolve the package from
        # the cwd and this repository has no root package.json.
        run: npm pack ./cli --pack-destination "$PWD"
      - name: Upload the manifest and tarball as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openthrottle-release-${{ steps.meta.outputs.release_id }}
          path: |
            cli/release-manifest.json
            openthrottle-*.tgz
          if-no-files-found: error
      - name: Resolve the npm publish gate
        id: publish
        # Publish only on tag pushes with NPM_TOKEN configured. A missing token
        # must never fail the release — the artifacts above are the fallback.
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" == "tag" && -n "$NPM_TOKEN" ]]; then
            echo "npm=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm=false" >> "$GITHUB_OUTPUT"
            echo "Skipping npm publish (requires a v* tag and the NPM_TOKEN secret); artifacts uploaded instead."
          fi
      - name: Publish the CLI to npm
        if: steps.publish.outputs.npm == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Publish the exact tarball uploaded as the release artifact so the
        # published bytes match the acceptance evidence.
        run: npm publish "$PWD"/openthrottle-*.tgz
