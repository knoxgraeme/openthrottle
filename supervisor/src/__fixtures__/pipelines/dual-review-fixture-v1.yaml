schema: openthrottle.pipeline/v1
id: fixture/dual-review
version: 1
description: Semantic-agent fixture with two review passes around simplification.
entry_stage: implementation
max_attempts: 8
requires:
  protocol: stage-executor@1
  capabilities: [agent/semantic@1]
stages:
  - id: implementation
    executor: { kind: agent, capability: agent/semantic@1 }
    evaluator: { kind: semantic, assurance: semantic_attested, required_artifacts: [stage_result] }
    context: fresh
    live_steering: true
    credentials: [model.invoke, repo.read, repo.write]
    produces: [stage_result]
    transitions:
      success: { to: semantic_review }
      no_change: { terminal: no_change }
      semantic_repair_required: { to: implementation, max_reentries: 1, on_exhausted: needs_human }
      retryable_infrastructure_failure: { to: implementation, max_reentries: 1, on_exhausted: failed }
      needs_human: { terminal: needs_human }
      canceled: { terminal: canceled }
      superseded: { terminal: superseded }
      failure: { terminal: failed }
  - id: semantic_review
    executor: { kind: agent, capability: agent/semantic@1 }
    evaluator: { kind: semantic, assurance: semantic_attested, required_artifacts: [review] }
    context: fresh
    live_steering: false
    credentials: [model.invoke, repo.read]
    produces: [review, stage_result]
    transitions:
      success: { to: simplification }
      no_change: { terminal: no_change }
      semantic_repair_required: { to: implementation, max_reentries: 2, on_exhausted: needs_human }
      retryable_infrastructure_failure: { to: semantic_review, max_reentries: 1, on_exhausted: failed }
      needs_human: { terminal: needs_human }
      canceled: { terminal: canceled }
      superseded: { terminal: superseded }
      failure: { terminal: failed }
  - id: simplification
    executor: { kind: agent, capability: agent/semantic@1 }
    evaluator: { kind: semantic, assurance: semantic_attested, required_artifacts: [stage_result] }
    context: resume_required
    live_steering: true
    credentials: [model.invoke, repo.read, repo.write]
    produces: [stage_result]
    transitions:
      success: { to: post_simplify_review }
      no_change: { terminal: no_change }
      semantic_repair_required: { to: simplification, max_reentries: 1, on_exhausted: needs_human }
      retryable_infrastructure_failure: { to: simplification, max_reentries: 1, on_exhausted: failed }
      needs_human: { terminal: needs_human }
      canceled: { terminal: canceled }
      superseded: { terminal: superseded }
      failure: { terminal: failed }
  - id: post_simplify_review
    executor: { kind: agent, capability: agent/semantic@1 }
    evaluator: { kind: semantic, assurance: semantic_attested, required_artifacts: [review] }
    context: fresh
    live_steering: false
    credentials: [model.invoke, repo.read]
    produces: [review, stage_result]
    transitions:
      success: { to: publish }
      no_change: { terminal: no_change }
      semantic_repair_required: { to: simplification, max_reentries: 2, on_exhausted: needs_human }
      retryable_infrastructure_failure: { to: post_simplify_review, max_reentries: 1, on_exhausted: failed }
      needs_human: { terminal: needs_human }
      canceled: { terminal: canceled }
      superseded: { terminal: superseded }
      failure: { terminal: failed }
  - id: publish
    executor: { kind: agent, capability: agent/semantic@1 }
    evaluator: { kind: semantic, assurance: semantic_attested, required_artifacts: [stage_result] }
    context: resume_required
    live_steering: false
    credentials: [model.invoke, repo.read, repo.write]
    produces: [stage_result]
    transitions:
      success: { terminal: shipped }
      no_change: { terminal: no_change }
      semantic_repair_required: { to: publish, max_reentries: 1, on_exhausted: needs_human }
      retryable_infrastructure_failure: { to: publish, max_reentries: 1, on_exhausted: failed }
      needs_human: { terminal: needs_human }
      canceled: { terminal: canceled }
      superseded: { terminal: superseded }
      failure: { terminal: failed }
