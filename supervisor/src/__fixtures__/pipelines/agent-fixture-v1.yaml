schema: openthrottle.pipeline/v1
id: fixture/agent
version: 1
description: Non-CE semantic-agent fixture covering fresh, resume, and review contexts.
entry_stage: fresh
max_attempts: 6
requires:
  protocol: stage-executor@1
  capabilities: [agent/semantic@1]
stages:
  - id: fresh
    executor: { kind: agent, capability: agent/semantic@1 }
    evaluator: { kind: semantic, assurance: semantic_attested, required_artifacts: [stage_result] }
    context: fresh
    live_steering: true
    credentials: [model.invoke, repo.read, repo.write]
    produces: [stage_result]
    transitions:
      success: { to: resume }
      no_change: { terminal: no_change }
      semantic_repair_required: { to: fresh, max_reentries: 1, on_exhausted: needs_human }
      retryable_infrastructure_failure: { to: fresh, max_reentries: 1, on_exhausted: failed }
      needs_human: { terminal: needs_human }
      canceled: { terminal: canceled }
      superseded: { terminal: superseded }
      failure: { terminal: failed }
  - id: resume
    executor: { kind: agent, capability: agent/semantic@1 }
    evaluator: { kind: semantic, assurance: semantic_attested, required_artifacts: [stage_result] }
    context: resume_required
    live_steering: true
    credentials: [model.invoke, repo.read, repo.write]
    produces: [stage_result]
    transitions:
      success: { to: review }
      no_change: { terminal: no_change }
      semantic_repair_required: { to: resume, max_reentries: 1, on_exhausted: needs_human }
      retryable_infrastructure_failure: { to: resume, max_reentries: 1, on_exhausted: failed }
      needs_human: { terminal: needs_human }
      canceled: { terminal: canceled }
      superseded: { terminal: superseded }
      failure: { terminal: failed }
  - id: review
    executor: { kind: agent, capability: agent/semantic@1 }
    evaluator: { kind: semantic, assurance: semantic_attested, required_artifacts: [review] }
    context: fresh
    live_steering: false
    credentials: [model.invoke, repo.read]
    produces: [review, stage_result]
    transitions:
      success: { terminal: shipped }
      no_change: { terminal: no_change }
      semantic_repair_required: { to: resume, max_reentries: 2, on_exhausted: needs_human }
      retryable_infrastructure_failure: { to: review, max_reentries: 1, on_exhausted: failed }
      needs_human: { terminal: needs_human }
      canceled: { terminal: canceled }
      superseded: { terminal: superseded }
      failure: { terminal: failed }
