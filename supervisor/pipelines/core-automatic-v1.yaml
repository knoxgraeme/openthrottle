schema: openthrottle.pipeline/v1
id: core/automatic
version: 1
description: Immutable automatic admission template with fresh typed planning and review, deterministic supervisor gates, and distinct simple and structured execution and publication tails.
entry_stage: admission_planner
max_attempts: 200
max_repair_rounds: 5
requires:
  protocol: stage-executor@1
  capabilities:
    - admission/plan@1
    - admission/review@1
    - supervisor/admission-gate@1
    - ce/implement@1
    - ce/review@1
    - ce/simplify@1
    - command/run@1
    - accept-unit@1
    - graph/for-each-unit@1
    - ce/publish@1
    - provider/wait@1
defaults:
  transitions:
    needs_human: { terminal: needs_human }
    canceled: { terminal: canceled }
    superseded: { terminal: superseded }
  retry: { max_reentries: 2, on_exhausted: failed }
stages:
  - id: admission_planner
    loop:
      id: admission-planner-loop
      skill: builtin://admission-plan@1
      input_scope: graph
      receipt: admission_decision
      max_parallel: 1
      max_rounds: 2
      timeout_seconds: 86400
    executor: { kind: agent, capability: admission/plan@1 }
    evaluator: { kind: semantic, assurance: semantic_attested, required_artifacts: [standard_receipt] }
    context: fresh
    live_steering: false
    credentials: [model.invoke, repo.read]
    produces: [stage_result, standard_receipt, execution_plan]
    transitions:
      success: { to: admission_decision_gate }
      no_change: { to: admission_decision_gate }
      semantic_repair_required: { to: admission_planner, max_reentries: 1, on_exhausted: failed }
      failure: { to: admission_planner, max_reentries: 1, on_exhausted: failed }
  - id: admission_decision_gate
    executor: { kind: supervisor, capability: supervisor/admission-gate@1 }
    evaluator: { kind: semantic, assurance: executor_verified, required_artifacts: [stage_result] }
    context: none
    live_steering: false
    credentials: []
    produces: [stage_result, execution_plan]
    transitions:
      success: { to: admission_reviewer }
      no_change: { to: simple_implementation }
      semantic_repair_required: { to: admission_planner, max_reentries: 1, on_exhausted: failed }
      failure: { terminal: failed }
  - id: admission_reviewer
    loop:
      id: admission-reviewer-loop
      skill: builtin://review-admission-plan@1
      input_scope: review
      receipt: admission_review
      max_parallel: 1
      max_rounds: 2
      timeout_seconds: 86400
    executor: { kind: agent, capability: admission/review@1 }
    evaluator: { kind: semantic, assurance: semantic_attested, required_artifacts: [standard_receipt] }
    context: fresh
    live_steering: false
    credentials: [model.invoke, repo.read]
    produces: [stage_result, standard_receipt]
    transitions:
      success: { to: admission_review_gate }
      no_change: { to: admission_review_gate }
      semantic_repair_required: { to: admission_reviewer, max_reentries: 1, on_exhausted: failed }
      failure: { to: admission_reviewer, max_reentries: 1, on_exhausted: failed }
  - id: admission_review_gate
    executor: { kind: supervisor, capability: supervisor/admission-gate@1 }
    evaluator: { kind: semantic, assurance: executor_verified, required_artifacts: [stage_result] }
    context: none
    live_steering: false
    credentials: []
    produces: [stage_result, execution_plan]
    transitions:
      success: { to: structured_edit }
      no_change: { to: structured_edit }
      semantic_repair_required: { to: admission_reviewer, max_reentries: 1, on_exhausted: failed }
      failure: { to: admission_planner, max_reentries: 1, on_exhausted: failed }
  - id: simple_implementation
    executor: { kind: agent, capability: ce/implement@1 }
    evaluator: { kind: semantic, assurance: semantic_attested, required_artifacts: [stage_result] }
    context: fresh
    live_steering: true
    credentials: [model.invoke, provider.read, repo.read, repo.write]
    produces: [stage_result]
    retry: { max_reentries: 3, on_exhausted: failed }
    transitions:
      success: { to: simple_semantic_review }
      no_change: { terminal: no_change }
      semantic_repair_required: { to: simple_implementation, max_reentries: 8, on_exhausted: needs_human }
      failure: { terminal: failed }
  - id: simple_repair_implementation
    executor: { kind: agent, capability: ce/implement@1 }
    evaluator: { kind: semantic, assurance: semantic_attested, required_artifacts: [stage_result] }
    context: resume_required
    live_steering: true
    credentials: [model.invoke, provider.read, repo.read, repo.write]
    produces: [stage_result]
    retry: { max_reentries: 3, on_exhausted: failed }
    transitions:
      success: { to: simple_repair_semantic_review }
      no_change: { to: simple_repair_semantic_review }
      semantic_repair_required: { to: simple_repair_implementation, max_reentries: 8, on_exhausted: needs_human }
      failure: { terminal: failed }
  - id: simple_repair_semantic_review
    executor: { kind: agent, capability: ce/review@1 }
    evaluator: { kind: semantic, assurance: semantic_attested, required_artifacts: [stage_result, review] }
    context: resume_required
    live_steering: false
    credentials: [model.invoke, repo.read, repo.write]
    produces: [stage_result, review]
    transitions:
      success: { to: simple_test }
      no_change: { to: simple_test }
      semantic_repair_required: { to: simple_repair_implementation, max_reentries: 5, on_exhausted: needs_human }
      failure: { to: simple_repair_implementation, max_reentries: 5, on_exhausted: needs_human }
  - id: simple_semantic_review
    executor: { kind: agent, capability: ce/review@1 }
    evaluator: { kind: semantic, assurance: semantic_attested, required_artifacts: [stage_result, review] }
    context: resume_required
    live_steering: false
    credentials: [model.invoke, repo.read, repo.write]
    produces: [stage_result, review]
    transitions:
      success: { to: simple_simplification }
      no_change: { to: simple_simplification }
      semantic_repair_required: { to: simple_repair_implementation, max_reentries: 5, on_exhausted: needs_human }
      failure: { to: simple_repair_implementation, max_reentries: 5, on_exhausted: needs_human }
  - id: simple_simplification
    executor: { kind: agent, capability: ce/simplify@1 }
    evaluator: { kind: semantic, assurance: semantic_attested, required_artifacts: [stage_result] }
    context: resume_required
    live_steering: false
    credentials: [model.invoke, repo.read, repo.write]
    produces: [stage_result]
    transitions:
      success: { to: simple_post_simplify_review }
      no_change: { to: simple_test }
      semantic_repair_required: { to: simple_repair_implementation, max_reentries: 5, on_exhausted: needs_human }
      failure: { to: simple_repair_implementation, max_reentries: 5, on_exhausted: needs_human }
  - id: simple_post_simplify_review
    executor: { kind: agent, capability: ce/review@1 }
    evaluator: { kind: semantic, assurance: semantic_attested, required_artifacts: [stage_result, review] }
    context: resume_required
    live_steering: false
    credentials: [model.invoke, repo.read, repo.write]
    produces: [stage_result, review]
    transitions:
      success: { to: simple_test }
      no_change: { to: simple_test }
      semantic_repair_required: { to: simple_repair_implementation, max_reentries: 5, on_exhausted: needs_human }
      failure: { to: simple_repair_implementation, max_reentries: 5, on_exhausted: needs_human }
  - id: simple_test
    executor: { kind: command, capability: command/run@1 }
    commandName: test
    evaluator: { kind: command, assurance: executor_verified, required_artifacts: [command_result] }
    context: none
    live_steering: false
    credentials: [repo.read]
    produces: [stage_result, command_result]
    transitions:
      success: { to: simple_lint }
      no_change: { to: simple_lint }
      semantic_repair_required: { to: simple_repair_implementation, max_reentries: 5, on_exhausted: needs_human }
      failure: { to: simple_repair_implementation, max_reentries: 5, on_exhausted: needs_human }
  - id: simple_lint
    executor: { kind: command, capability: command/run@1 }
    commandName: lint
    evaluator: { kind: command, assurance: executor_verified, required_artifacts: [command_result] }
    context: none
    live_steering: false
    credentials: [repo.read]
    produces: [stage_result, command_result]
    transitions:
      success: { to: simple_build }
      no_change: { to: simple_build }
      semantic_repair_required: { to: simple_repair_implementation, max_reentries: 5, on_exhausted: needs_human }
      failure: { to: simple_repair_implementation, max_reentries: 5, on_exhausted: needs_human }
  - id: simple_build
    executor: { kind: command, capability: command/run@1 }
    commandName: build
    evaluator: { kind: command, assurance: executor_verified, required_artifacts: [command_result] }
    context: none
    live_steering: false
    credentials: [repo.read]
    produces: [stage_result, command_result]
    transitions:
      success: { to: simple_publish }
      no_change: { to: simple_publish }
      semantic_repair_required: { to: simple_repair_implementation, max_reentries: 5, on_exhausted: needs_human }
      failure: { to: simple_repair_implementation, max_reentries: 5, on_exhausted: needs_human }
  - id: simple_publish
    executor: { kind: agent, capability: ce/publish@1 }
    evaluator: { kind: publish_subject, assurance: semantic_attested, required_artifacts: [publish_subject] }
    context: resume_required
    live_steering: false
    credentials: [model.invoke, repo.read, repo.write, provider.read]
    produces: [stage_result, publish_subject]
    transitions:
      success: { to: simple_provider }
      no_change: { terminal: no_change }
      semantic_repair_required: { to: simple_repair_implementation, max_reentries: 5, on_exhausted: needs_human }
      failure: { terminal: failed }
  - id: simple_provider
    executor: { kind: provider_wait, capability: provider/wait@1 }
    evaluator: { kind: provider, assurance: provider_verified, required_artifacts: [provider_check] }
    context: none
    live_steering: false
    credentials: [provider.read]
    produces: [stage_result, provider_check]
    transitions:
      success: { terminal: shipped }
      no_change: { terminal: no_change }
      semantic_repair_required: { to: simple_repair_implementation, max_reentries: 5, on_exhausted: needs_human }
      failure: { terminal: failed }
  - id: structured_edit
    executor: { kind: loop_action, capability: graph/for-each-unit@1 }
    evaluator: { kind: semantic, assurance: executor_verified, required_artifacts: [execution_graph_result] }
    context: none
    live_steering: false
    credentials: [provider.read, repo.read]
    produces: [stage_result, execution_graph_result]
    unitPhases: [implement, simplify, command, candidate, lead, integrate]
    unitCommandNames: [test, lint, build]
    unitPhaseBindings:
      - id: implement
        kind: agent
        loop: { id: unit-loop, skill: builtin://ce/implement@1, input_scope: unit, receipt: unit_completion, max_parallel: 1, max_rounds: 8, timeout_seconds: 86400 }
        worker: { id: unit-worker, engine: agent, allowed_mcp_servers: [], session_scope: attempt, credentials: [model.invoke, provider.read, repo.read] }
        executor: { kind: agent, capability: ce/implement@1 }
        context: resume_required
        credentials: [model.invoke, provider.read, repo.read]
      - id: simplify
        kind: agent
        loop: { id: simplify-loop, skill: builtin://ce/simplify@1, input_scope: unit, receipt: unit_completion, max_parallel: 1, max_rounds: 3, timeout_seconds: 86400 }
        worker: { id: simplify-worker, engine: agent, allowed_mcp_servers: [], session_scope: attempt, credentials: [model.invoke, repo.read] }
        executor: { kind: agent, capability: ce/simplify@1 }
        context: resume_required
        credentials: [model.invoke, repo.read]
      - { id: command, kind: command, commands: [test, lint, build] }
      - { id: candidate, kind: evidence }
      - id: lead
        kind: gate
        loop: { id: lead-loop, skill: builtin://accept-unit@1, input_scope: unit, receipt: unit_decision, max_parallel: 1, max_rounds: 1, timeout_seconds: 86400 }
        worker: { id: lead-worker, engine: agent, allowed_mcp_servers: [], session_scope: graph, credentials: [model.invoke, repo.read] }
        executor: { kind: agent, capability: accept-unit@1 }
        context: prefer_resume
        credentials: [model.invoke, repo.read]
      - { id: integrate, kind: integrate }
    transitions:
      success: { to: structured_publish }
      no_change: { terminal: no_change }
      semantic_repair_required: { terminal: needs_human }
      failure: { terminal: failed }
  - id: structured_publish
    executor: { kind: agent, capability: ce/publish@1 }
    evaluator: { kind: publish_subject, assurance: semantic_attested, required_artifacts: [publish_subject] }
    context: prefer_resume
    live_steering: false
    credentials: [model.invoke, provider.read, repo.read, repo.write]
    produces: [stage_result, publish_subject]
    transitions:
      success: { to: structured_provider }
      no_change: { terminal: no_change }
      semantic_repair_required: { terminal: needs_human }
      failure: { terminal: failed }
  - id: structured_provider
    executor: { kind: provider_wait, capability: provider/wait@1 }
    evaluator: { kind: provider, assurance: provider_verified, required_artifacts: [provider_check] }
    context: none
    live_steering: false
    credentials: [provider.read]
    produces: [stage_result, provider_check]
    transitions:
      success: { terminal: shipped }
      no_change: { terminal: no_change }
      semantic_repair_required: { terminal: needs_human }
      failure: { terminal: failed }
