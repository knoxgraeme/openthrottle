schema: openthrottle.pipeline/v1
id: core/tune
version: 1
description: Immutable self-tuning pipeline with read-only typed corpus analysis and proposal generation, supervisor-owned citation and differential-ratchet gates, a structured isolated edit with deterministic review fanout and bounded repair, exact-subject publication, provider verification, and mandatory human merge.
entry_stage: analysis
max_attempts: 200
max_repair_rounds: 5
requires:
  protocol: stage-executor@1
  capabilities:
    - core/tune@1
    - supervisor/citation-gate@1
    - supervisor/differential-ratchet@1
    - ce/implement@1
    - ce/simplify@1
    - accept-unit@1
    - graph/for-each-unit@1
    - ce/publish@1
    - provider/wait@1
defaults:
  transitions:
    retryable_infrastructure_failure: { to: analysis, max_reentries: 2, on_exhausted: failed }
    semantic_repair_required: { terminal: needs_human }
    needs_human: { terminal: needs_human }
    canceled: { terminal: canceled }
    superseded: { terminal: superseded }
    failure: { terminal: failed }
stages:
  - id: analysis
    executor: { kind: agent, capability: core/tune@1 }
    evaluator: { kind: semantic, assurance: semantic_attested, required_artifacts: [standard_receipt] }
    context: fresh
    live_steering: false
    credentials: [model.invoke, provider.read, repo.read]
    produces: [stage_result, standard_receipt]
    transitions:
      success: { to: proposal }
      no_change: { terminal: no_change }
  - id: proposal
    executor: { kind: agent, capability: core/tune@1 }
    evaluator: { kind: semantic, assurance: semantic_attested, required_artifacts: [standard_receipt] }
    context: fresh
    live_steering: false
    credentials: [model.invoke, provider.read, repo.read]
    produces: [stage_result, standard_receipt]
    transitions:
      success: { to: citation_gate }
      no_change: { terminal: no_change }
  - id: citation_gate
    executor: { kind: supervisor, capability: supervisor/citation-gate@1 }
    evaluator: { kind: citation, assurance: executor_verified, required_artifacts: [stage_result] }
    context: none
    live_steering: false
    credentials: []
    produces: [stage_result]
    transitions:
      success: { to: differential_ratchet }
      no_change: { terminal: no_change }
  - id: differential_ratchet
    executor: { kind: supervisor, capability: supervisor/differential-ratchet@1 }
    evaluator: { kind: differential_ratchet, assurance: executor_verified, required_artifacts: [stage_result] }
    context: none
    live_steering: false
    credentials: []
    produces: [stage_result]
    transitions:
      success: { to: structured_edit }
      no_change: { terminal: no_change }
  - id: structured_edit
    executor: { kind: loop_action, capability: graph/for-each-unit@1 }
    evaluator: { kind: semantic, assurance: executor_verified, required_artifacts: [execution_graph_result] }
    context: none
    live_steering: false
    credentials: [provider.read, repo.read]
    produces: [stage_result, execution_graph_result]
    unitPhases: [implement, simplify, command, candidate, lead, integrate]
    unitCommandNames: [test, lint, build]
    unitPhaseBindings:
      - id: implement
        kind: agent
        loop:
          id: unit-loop
          skill: builtin://ce/implement@1
          input_scope: unit
          receipt: unit_completion
          max_parallel: 1
          max_rounds: 8
          timeout_seconds: 86400
        worker:
          id: unit-worker
          engine: agent
          allowed_mcp_servers: []
          session_scope: attempt
          credentials: [model.invoke, provider.read, repo.read]
        executor: { kind: agent, capability: ce/implement@1 }
        context: resume_required
        credentials: [model.invoke, provider.read, repo.read]
      - id: simplify
        kind: agent
        loop:
          id: simplify-loop
          skill: builtin://ce/simplify@1
          input_scope: unit
          receipt: unit_completion
          max_parallel: 1
          max_rounds: 3
          timeout_seconds: 86400
        worker:
          id: simplify-worker
          engine: agent
          allowed_mcp_servers: []
          session_scope: attempt
          credentials: [model.invoke, repo.read]
        executor: { kind: agent, capability: ce/simplify@1 }
        context: resume_required
        credentials: [model.invoke, repo.read]
      - id: command
        kind: command
        commands: [test, lint, build]
      - id: candidate
        kind: evidence
      - id: lead
        kind: gate
        loop:
          id: lead-loop
          skill: builtin://accept-unit@1
          input_scope: unit
          receipt: unit_decision
          max_parallel: 1
          max_rounds: 1
          timeout_seconds: 86400
        worker:
          id: lead-worker
          engine: agent
          allowed_mcp_servers: []
          session_scope: graph
          credentials: [model.invoke, repo.read]
        executor: { kind: agent, capability: accept-unit@1 }
        context: prefer_resume
        credentials: [model.invoke, repo.read]
      - id: integrate
        kind: integrate
    transitions:
      success: { to: publish }
      no_change: { terminal: no_change }
  - id: publish
    executor: { kind: agent, capability: ce/publish@1 }
    evaluator: { kind: publish_subject, assurance: semantic_attested, required_artifacts: [publish_subject] }
    context: prefer_resume
    live_steering: false
    credentials: [model.invoke, provider.read, repo.read, repo.write]
    produces: [stage_result, publish_subject]
    transitions:
      success: { to: provider }
      no_change: { terminal: no_change }
  - id: provider
    executor: { kind: provider_wait, capability: provider/wait@1 }
    evaluator: { kind: provider, assurance: provider_verified, required_artifacts: [provider_check] }
    context: none
    live_steering: false
    credentials: [provider.read]
    produces: [stage_result, provider_check]
    transitions:
      success: { terminal: shipped }
      no_change: { terminal: no_change }
